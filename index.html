<body>
    <h1>JavaScript Conditional Statements</h1>
    <!--Wowo-->
    <input type="text" id="Age" class="form-control" placeholder="typer here..."

    <button class="btn btn-info" onclick="checkAge()"></button>
    <button class="btn btn-info" onclick="checkAge()">Check</button>

    <script>
        function checkAge(){
            var age = document.getElementById("Age").value;

            if(isNaN(age) || age < 0){
                alert("Please input a valid number of your age imnida.")
            }

        else if(age < 18){
          alert("You are underage imnida.");
        }
        else if(age > 18){
            alert("You are of legal age imnida");
        }
        else{
            alert("Please inidcate your age imnida.");
        }
        }    
    </script>
